name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: mvn test (jdk ${{ matrix.jdk }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        jdk: ['17', '21']
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK ${{ matrix.jdk }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
          cache: maven

      # gpg signing is only required on a release; skip during PR / branch CI so we don't
      # need the maintainer's private key in repo secrets.
      - name: Run unit tests
        run: mvn -B -Dgpg.skip=true -Dmaven.javadoc.skip=true test

      - name: Package with sources and Javadocs (skip tests, smoke build only)
        run: mvn -B -Dgpg.skip=true -DskipTests -P publish-artifacts package
