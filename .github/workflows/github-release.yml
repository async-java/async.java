name: github release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to create or refresh as a GitHub Release
        required: true
        default: v0.2.11
  push:
    branches:
      - master
    paths:
      - '.github/workflows/github-release.yml'

permissions:
  contents: write

jobs:
  create:
    name: create github release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Resolve release tag
        id: release
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-}"
          if [ -z "$tag" ]; then
            version="$(sed -n 's:.*<version>\([^<]*\)</version>.*:\1:p' pom.xml | head -n 1)"
            tag="v$version"
          else
            version="${tag#v}"
          fi
          if [ -z "$version" ] || [ "$version" = "$tag" ]; then
            echo "::error::could not resolve version from tag $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Download published Maven Central artifacts
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          base="https://repo.maven.apache.org/maven2/io/github/oresoftware/async-java/$VERSION"
          mkdir -p dist
          for file in \
            "async-java-$VERSION.jar" \
            "async-java-$VERSION-sources.jar" \
            "async-java-$VERSION-javadoc.jar"; do
            curl --fail --silent --show-error --location --retry 12 --retry-delay 10 \
              --output "dist/$file" "$base/$file"
          done

      - name: Create or refresh GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          auth_header="Authorization: Bearer $GITHUB_TOKEN"
          accept_header="Accept: application/vnd.github+json"
          version_header="X-GitHub-Api-Version: 2022-11-28"

          status="$(curl --silent --show-error --location \
            --header "$auth_header" \
            --header "$accept_header" \
            --header "$version_header" \
            --output release.json \
            --write-out '%{http_code}' \
            "$api/releases/tags/$TAG")"

          if [ "$status" = "404" ]; then
            jq -n --arg tag "$TAG" '{
              tag_name: $tag,
              name: $tag,
              generate_release_notes: true
            }' > release-request.json
            status="$(curl --silent --show-error --location \
              --request POST \
              --header "$auth_header" \
              --header "$accept_header" \
              --header "$version_header" \
              --header "Content-Type: application/json" \
              --data @release-request.json \
              --output release.json \
              --write-out '%{http_code}' \
              "$api/releases")"
          fi

          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            cat release.json >&2
            exit 1
          fi

          assets_url="$(jq -r '.assets_url' release.json)"
          upload_url="$(jq -r '.upload_url | sub("\\{.*"; "")' release.json)"

          for asset in dist/*; do
            name="$(basename "$asset")"
            existing_id="$(curl --silent --show-error --location \
              --header "$auth_header" \
              --header "$accept_header" \
              --header "$version_header" \
              "$assets_url" | jq -r --arg name "$name" '.[] | select(.name == $name) | .id' | head -n 1)"

            if [ -n "$existing_id" ]; then
              curl --fail --silent --show-error --location \
                --request DELETE \
                --header "$auth_header" \
                --header "$accept_header" \
                --header "$version_header" \
                "$api/releases/assets/$existing_id"
            fi

            curl --fail --silent --show-error --location \
              --request POST \
              --header "$auth_header" \
              --header "$accept_header" \
              --header "$version_header" \
              --header "Content-Type: application/java-archive" \
              --data-binary "@$asset" \
              "$upload_url?name=$name"
          done
